  text-overflow: ellipsis;
}
.lib-desc {
  margin: 0;

  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

.lib-entry-actions {

<script>
// Catalogo globale dei giochi
const CATALOG = {
  dantes_revenge: {
    title:   "Dante's Revenge",
    version: "Beta 1.0",
    desc:    "WAD di Doom — Divina Commedia",
    img:     "img/TITLEPIC.png",
    file:    "SELV01.zip",
    size:    "17,7 MB",
    engine:  "GZDoom",
    page:    "dantes_revenge.html"
  }
};

// Funzione globale di download attivata dai bottoni del template
function downloadGame(id) {
  const g = CATALOG[id];
  if (!g) return;
  const a = document.createElement('a');
  a.href = g.file;
  a.download = g.file;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('Download avviato!');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// Avvia tutto solo dopo che il DOM e Firebase sono pronti
document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const uid = params.get("uid");

  if(!uid){
    document.body.innerHTML = "<p style='text-align:center; padding-top: 50px;'>Profilo non valido</p>";
    return;
  }

  // Chiamata a Firestore con db sicuro
  db.collection("users").doc(uid).get().then(doc=>{
    if(!doc.exists){
      document.body.innerHTML = "<p style='text-align:center; padding-top: 50px;'>Utente non trovato</p>";
      return;
    }

    const d = doc.data();

    /* SEMPRE VISIBILI */
    document.getElementById("username").textContent = d.displayName || "Utente";

    if(d.photoBase64)
      document.getElementById("avatar").src = d.photoBase64;

    /* SE IL PROFILO È PRIVATO */
    if(d.profilePublic !== true){
      document.getElementById("banner").style.display = "none";
      document.getElementById("bio").style.display = "none";
      document.getElementById("country").style.display = "none";
      document.getElementById("joined").style.display = "none";
      document.getElementById("status").style.display = "none";
      document.getElementById("privateMsg").style.display = "block";
      document.getElementById("publicLibrarySection").style.display = "none";
      document.getElementById("playedGamesSection").style.display = "none";
      return;
    }

    /* DATI PUBBLICI GENERALI */
    if(d.banner) document.getElementById("banner").src = d.banner;
    if(d.bio) document.getElementById("bio").textContent = d.bio;
    if(d.country) document.getElementById("country").textContent = "🌍 " + d.country;

    if(d.createdAt){
      const date = d.createdAt.toDate ? d.createdAt.toDate() : new Date(d.createdAt);
      document.getElementById("joined").textContent = "📅 Iscritto il " + date.toLocaleDateString();
    }
    document.getElementById("status").textContent = "🌐 Profilo pubblico";

    /* ── 1. RENDERING LIBRERIA ── */
    const library = Array.isArray(d.library) ? d.library : [];
    const owned = library.filter(id => CATALOG[id]);
    const libSection = document.getElementById("publicLibrarySection");
    const libContent = document.getElementById("libContent");

    libSection.style.display = "block";
    if (owned.length === 0) {
      libContent.innerHTML = `
        <div class="lib-empty">
          <div class="lib-empty-icon">🎮</div>
          <p>Libreria vuota. Questo utente non ha giochi salvati.</p>
        </div>`;
    } else {
      libContent.innerHTML = owned.map(id => buildGameRow(id, true)).join('');
    }

    /* ── 2. RENDERING GIOCHI GIOCATI ── */
    const playedGames = Array.isArray(d.playedGames) ? d.playedGames : [];
    const played = playedGames.filter(id => CATALOG[id]);
    const playedSection = document.getElementById("playedGamesSection");
    const playedContent = document.getElementById("playedContent");

    playedSection.style.display = "block";
    if (played.length === 0) {
      playedContent.innerHTML = `
        <div class="lib-empty">
          <div class="lib-empty-icon">🕹️</div>
          <p>Nessun gioco giocato di recente da questo utente.</p>
        </div>`;
    } else {
      playedContent.innerHTML = played.map(id => buildGameRow(id, false)).join('');
    }
  }).catch(err => {
    console.error("Errore nel recupero dati utente:", err);
  });
});

// Funzione interna per strutturare i box grafici dei giochi
function buildGameRow(id, showDownload) {
  const g = CATALOG[id];
  
  const downloadBtn = showDownload ? `
    <button class="lib-btn-download" onclick="downloadGame('${id}')">
      ⬇ Scarica
    </button>
  ` : '';

  return `
    <div class="lib-entry" id="entry-${id}">
      <img class="lib-entry-cover" src="${g.img}" alt="${g.title}">
      <div class="lib-entry-info">
        <h3>${g.title}</h3>
        <p class="lib-desc">${g.desc}</p>
        <div class="lib-entry-meta">
          <span class="lib-tag">${g.version}</span>
          <span class="lib-info-text">${g.size} · ${g.engine}</span>
        </div>
      </div>
      <div class="lib-entry-actions">
        ${downloadBtn}
        <a class="lib-btn-outline" href="${g.page}">
          Dettagli
        </a>
      </div>
    </div>`;
}
</script>
