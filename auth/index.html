<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETA Games — Accesso</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0e0e0e;
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 40px 44px;
      max-width: 380px;
      width: 90%;
      text-align: center;
    }
    .logo {
      width: 56px; height: 56px;
      border-radius: 14px;
      margin: 0 auto 20px;
      overflow: hidden;
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    h1 { font-size: 22px; font-weight: 700; color: #e50914; margin-bottom: 6px; }
    p  { font-size: 13px; color: #888; margin-bottom: 28px; }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-google { background: #fff; color: #1f1f1f; }
    .error { color: #e05050; font-size: 13px; margin-top: 14px; min-height: 20px; }
    .success { color: #4caf50; font-size: 14px; margin-top: 14px; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="https://eta-games.github.io/img/channels4_profile.jpg" alt="ETA Games"></div>
  <h1>ETA Games</h1>
  <p>Accedi con il tuo account Google per continuare nel Launcher</p>
  <button class="btn btn-google" id="btn-google">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/>
      <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
      <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
      <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
    </svg>
    Accedi con Google
  </button>
  <div class="error" id="error"></div>
  <div class="success" id="success" style="display:none">✓ Accesso riuscito! Ritorno al Launcher…</div>
</div>

<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyCiWCjKAsNYLnDJT1o3r_E3tGLyYTasDPc",
    authDomain:        "etagames-b5d6a.firebaseapp.com",
    projectId:         "etagames-b5d6a",
    storageBucket:     "etagames-b5d6a.firebasestorage.app",
    messagingSenderId: "809625655346",
    appId:             "1:809625655346:web:3010a62960fde91787842b"
  });

  const auth = firebase.auth();
  const btn  = document.getElementById('btn-google');
  const errEl = document.getElementById('error');
  const okEl  = document.getElementById('success');

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.innerHTML = '<span style="opacity:0.6">Apertura Google…</span>';
    errEl.textContent = '';
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      const result   = await auth.signInWithPopup(provider);
      const idToken  = await result.user.getIdToken();

      const params = new URLSearchParams({
        idToken,
        uid:         result.user.uid,
        email:       result.user.email        || '',
        displayName: result.user.displayName  || '',
        photoURL:    result.user.photoURL     || ''
      });

      okEl.style.display = 'block';
      btn.style.display  = 'none';

      // Redirige verso il deep link — Electron lo intercetta
      window.location.href = 'etagames://auth?' + params.toString();

    } catch(e) {
      const ERRS = {
        'auth/popup-closed-by-user':     'Accesso annullato.',
        'auth/popup-blocked':            'Popup bloccato. Riprova.',
        'auth/cancelled-popup-request':  'Richiesta annullata.',
        'auth/network-request-failed':   'Errore di rete.',
      };
      errEl.textContent = ERRS[e.code] || e.message;
      btn.disabled = false;
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
      </svg> Accedi con Google`;
    }
  });
</script>
</body>
</html>
